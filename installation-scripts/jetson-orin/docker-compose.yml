
services:
  # MQTT Broker - Mosquitto
  mqtt-broker:
    image: eclipse-mosquitto:2.0.14
    container_name: dreamkit-mqtt-broker
    restart: unless-stopped
    hostname: mqtt-broker
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    networks:
      - dreamkit-network
    volumes:
      - ./mosquitto-config:/mosquitto/config
      - ./mosquitto-data:/mosquitto/data
      - ./mosquitto-logs:/mosquitto/log
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1883"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SDV Runtime - Software Defined Vehicle Runtime
  sdv-runtime:
    image: ghcr.io/eclipse-autowrx/sdv-runtime:latest
    container_name: dreamkit-sdv-runtime
    restart: unless-stopped
    hostname: sdv-runtime
    ports:
      - "55555:55555"
    networks:
      - dreamkit-network
    volumes:
      - ${HOME}/.dk/sdv-runtime/vss.json:/home/dev/ws/vss.json:ro
    environment:
      - USER=${DK_USER:-dreamkit}
      - RUNTIME_NAME=${RUNTIME_NAME:-dreamkit-runtime}
      - ARCH=${ARCH:-x86_64}
      - OFFLINE_MODE=true
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 55555)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      mqtt-broker:
        condition: service_healthy

  # DreamKit Manager - Core Management Service
  dk-manager:
    image: ${DOCKER_HUB_NAMESPACE:-ghcr.io/eclipse-autowrx}/dk_manager:latest
    container_name: dreamkit-dk-manager
    restart: unless-stopped
    hostname: dk-manager
    networks:
      - dreamkit-network
    privileged: true  # Required for Docker management
    volumes:
      - ${HOME}/.dk:/app/.dk
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      - USER=${DK_USER:-dreamkit}
      - DOCKER_HUB_NAMESPACE=${DOCKER_HUB_NAMESPACE:-ghcr.io/eclipse-autowrx}
      - ARCH=${ARCH:-x86_64}
      - TZ=UTC
    depends_on:
      sdv-runtime:
        condition: service_healthy

  # IVI Interface - In-Vehicle Infotainment (Conditional)
  dk-ivi:
    image: ${DOCKER_HUB_NAMESPACE:-ghcr.io/eclipse-autowrx}/dk_ivi:latest
    container_name: dreamkit-dk-ivi
    restart: unless-stopped
    hostname: dk-ivi
    network_mode: host
    volumes:
      - ${HOME}/.dk:/app/.dk
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR:-/tmp}/pulse:/run/pulse
    environment:
      - USER=${DK_USER:-dreamkit}
      - DOCKER_HUB_NAMESPACE=${DOCKER_HUB_NAMESPACE:-ghcr.io/eclipse-autowrx}
      - ARCH=${ARCH:-x86_64}
      - DISPLAY=${DISPLAY:-:0}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/tmp}
      - KUKSA_DATA_BROKER_ADDR=sdv-runtime:55555
      - VAPI_HOST=sdv-runtime
      - VAPI_PORT=55555
      - KUKSA_HOST=sdv-runtime
      - KUKSA_PORT=55555
    privileged: true
    depends_on:
      dk-manager:
        condition: service_started
    profiles:
      - ivi  # Only start if dk_ivi=true

  # Local Docker Registry (Optional)
  local-registry:
    image: registry:2.8
    container_name: dreamkit-local-registry
    restart: unless-stopped
    hostname: local-registry
    ports:
      - "5000:5000"
    networks:
      - dreamkit-network
    volumes:
      - ./registry-data:/var/lib/registry
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
      - REGISTRY_LOG_LEVEL=info
    profiles:
      - registry  # Only start if needed for local development

networks:
  dreamkit-network:
    name: dreamkit-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  mosquitto-config:
    driver: local
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
  registry-data:
    driver: local