# Mosquitto configuration for dreamKIT
# No authentication, suitable for local development

# Network settings
listener 1883
protocol mqtt

# WebSocket support
listener 9001
protocol websockets

# Allow connections from anywhere (local network)
allow_anonymous true

# Connection logging
log_type error
log_type warning
log_type notice
log_type information
log_dest stdout

# Client settings
max_connections 1000
max_queued_messages 1000

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Security (minimal for local development)
require_certificate false
use_identity_as_username false

# Auto-save interval
autosave_interval 1800

# Message size
message_size_limit 0